<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Znews_Thumb định dạng đặc biệt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Màu và chữ ===== */
:root{
  --nen-lam-viec:#6D7074;   /* xám trung tính, để nhìn ảnh không bị lệch màu */
  --giay:#F3F3F1;
  --muc:#1C1E21;
  --muc-nhat:#6A6D72;
  --duong-ke:#D9D9D5;
  --nhan:#1F5BFF;           /* màu nhấn: xanh điện */
  --nhan-dam:#1546D6;
  --vang-luoi:#FFD60A;      /* màu lưới 1/3 */
  --bao-loi:#D92D20;
  --chu:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--chu);color:var(--muc);background:var(--nen-lam-viec);font-size:15px;line-height:1.45}

.bo-cuc{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:100%}

/* ===== Vùng xem ảnh ===== */
.vung-anh{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;gap:14px}
.khung{position:relative;width:100%;max-width:900px;aspect-ratio:3/2;background:#55585C;outline:1px solid rgba(255,255,255,.18)}
.khung canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.khung.dang-keo canvas{cursor:grabbing}
.khung.trong canvas{cursor:pointer}
.khung:focus-visible{outline:3px solid var(--vang-luoi);outline-offset:3px}

/* lưới 1/3, chỉ để canh, không xuất ra ảnh */
.luoi{position:absolute;inset:0;pointer-events:none;display:none;
  background:
    linear-gradient(to right,transparent calc(33.333% - .5px),rgba(255,214,10,.85) calc(33.333% - .5px),rgba(255,214,10,.85) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),rgba(255,214,10,.85) calc(66.666% - .5px),rgba(255,214,10,.85) calc(66.666% + .5px),transparent calc(66.666% + .5px)),
    linear-gradient(to bottom,transparent calc(33.333% - .5px),rgba(255,214,10,.85) calc(33.333% - .5px),rgba(255,214,10,.85) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),rgba(255,214,10,.85) calc(66.666% - .5px),rgba(255,214,10,.85) calc(66.666% + .5px),transparent calc(66.666% + .5px))}
.luoi.hien{display:block}

/* màn hình trống khi chưa có ảnh */
.goi-y{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:24px;pointer-events:none;
  border:2px dashed rgba(255,255,255,.45)}
.goi-y b{font-size:clamp(17px,2.2vw,22px);font-weight:600}
.goi-y small{color:rgba(255,255,255,.75);font-size:14px}
.khung:not(.trong) .goi-y{display:none}
.khung.tha-vao .goi-y{display:flex;background:rgba(31,91,255,.35);border-color:#fff}

.duoi-khung{width:100%;max-width:900px;display:flex;justify-content:space-between;gap:12px;color:rgba(255,255,255,.85);font-size:13px}
.canh-bao{color:#FFE27A}

/* ===== Bảng điều khiển ===== */
.bang{background:var(--giay);padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.bang h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.bang h1 small{display:block;font-size:13px;font-weight:400;color:var(--muc-nhat);margin-top:2px;letter-spacing:0}
.buoc{display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--duong-ke);padding-top:14px}
.buoc h2{font-size:14px;font-weight:600;margin:0;display:flex;gap:8px;align-items:baseline}
.buoc h2 i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--muc);color:#fff;font-size:11px;font-weight:700;flex:none;transform:translateY(-1px)}

/* ô chọn định dạng */
.luoi-dd{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.o-dd{appearance:none;border:0;margin:0;padding:8px 6px 6px;background:#3A3D41;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(255,255,255,.7);font:inherit;font-size:11px;line-height:1.2;min-height:60px;justify-content:flex-end;
  box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .12s,background .12s}
.o-dd img{max-width:100%;max-height:26px;object-fit:contain;display:block;margin:auto 0}
.o-dd:hover{background:#4A4D52}
.o-dd[aria-pressed="true"]{background:#17191C;color:#fff;font-weight:600;box-shadow:inset 0 0 0 3px var(--nhan)}
.o-dd:focus-visible{outline:3px solid var(--vang-luoi);outline-offset:2px}

/* nút */
.nut{appearance:none;border:1px solid var(--muc);background:transparent;color:var(--muc);font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:6px;cursor:pointer}
.nut:hover{background:#E4E4E0}
.nut:focus-visible{outline:3px solid var(--nhan);outline-offset:2px}
.nut-chinh{background:var(--nhan);border-color:var(--nhan);color:#fff;font-size:16px;padding:13px 16px;width:100%}
.nut-chinh:hover{background:var(--nhan-dam)}
.nut-chinh:disabled{background:#B9BCC4;border-color:#B9BCC4;cursor:not-allowed}
.hang-nut{display:flex;gap:8px;flex-wrap:wrap}

/* thanh trượt */
.thanh{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.thanh label{font-size:14px}
.thanh output{font-size:13px;color:var(--muc-nhat);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.thanh input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--nhan);margin:0}
.thanh input:disabled{opacity:.45}

.chon{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chon input{accent-color:var(--nhan);width:17px;height:17px;margin:0}

.o-ngay{display:flex;flex-direction:column;gap:4px;font-size:14px}
.o-ngay input{font:inherit;padding:8px 10px;border:1px solid #BFC0BC;border-radius:6px;background:#fff;color:var(--muc)}
.o-ngay input:focus-visible{outline:3px solid var(--nhan);outline-offset:1px}
.ten-file{font-size:14px;word-break:break-all;background:#fff;border:1px solid var(--duong-ke);border-radius:6px;padding:8px 10px}
.ten-file span{color:var(--muc-nhat);display:block;font-size:12px}
.thong-bao{font-size:13.5px;min-height:1.4em;margin:0}
.thong-bao.loi{color:var(--bao-loi)}
.an{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .bo-cuc{grid-template-columns:1fr}
  .vung-anh{padding:16px 12px}
  .bang{position:static;max-height:none}
  .luoi-dd{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bo-cuc">

  <main class="vung-anh">
    <div class="khung trong" id="khung" tabindex="0" aria-label="Khung ảnh thumb. Kéo để di chuyển, cuộn chuột để phóng to thu nhỏ, phím mũi tên để dịch ảnh.">
      <canvas id="manHinh" width="900" height="600"></canvas>
      <div class="luoi" id="luoi"></div>
      <div class="goi-y">
        <b>Kéo ảnh vào đây</b>
        <small>hoặc bấm để chọn ảnh, hoặc dán ảnh bằng Ctrl+V</small>
      </div>
    </div>
    <div class="duoi-khung">
      <span id="thongTinAnh">Chưa có ảnh</span>
      <span class="canh-bao" id="canhBao"></span>
    </div>
  </main>

  <aside class="bang">
    <h1>Znews_Thumb định dạng đặc biệt<small>Đóng logo định dạng, xuất JPG 900×600</small></h1>

    <section class="buoc">
      <h2><i>1</i>Chọn định dạng</h2>
      <div class="luoi-dd" id="luoiDinhDang"></div>
    </section>

    <section class="buoc">
      <h2><i>2</i>Chọn ảnh</h2>
      <div class="hang-nut">
        <button class="nut" id="nutChonAnh" type="button">Chọn ảnh từ máy</button>
      </div>
      <input type="file" id="oChonFile" accept="image/*" class="an">
    </section>

    <section class="buoc">
      <h2><i>3</i>Chỉnh khung</h2>
      <div class="thanh">
        <label for="thanhZoom">Phóng to</label><output id="soZoom">100%</output>
        <input type="range" id="thanhZoom" min="100" max="500" step="1" value="100" disabled>
      </div>
      <div class="thanh">
        <label for="thanhDen">Lớp đen phía dưới</label><output id="soDen">30%</output>
        <input type="range" id="thanhDen" min="0" max="100" step="1" value="30">
      </div>
      <label class="chon"><input type="checkbox" id="oLuoi"> Hiện lưới 1/3 để canh</label>
      <div class="hang-nut">
        <button class="nut" id="nutDatLai" type="button" disabled>Đặt lại khung</button>
      </div>
    </section>

    <section class="buoc">
      <h2><i>4</i>Xuất ảnh</h2>
      <label class="o-ngay">Ngày làm
        <input type="date" id="oNgay">
      </label>
      <div class="ten-file"><span>Tên file sẽ lưu</span><b id="tenFile">…</b></div>
      <button class="nut nut-chinh" id="nutXuat" type="button" disabled>Tải ảnh JPG</button>
      <p class="thong-bao" id="thongBao" role="status"></p>
    </section>
  </aside>
</div>

/* ===== Hằng số ===== */
const RONG = 900, CAO = 600;
const ZOOM_TOI_DA = 5;              // phóng to tối đa 5 lần so với vừa khung
const DUNG_LUONG_TOI_DA = 2 * 1024 * 1024;   // 2 MB
const BAT_DAU_LOP_DEN = 0.3;        // lớp đen bắt đầu từ 30% chiều cao, đậm dần xuống đáy

/* ===== Trạng thái ===== */
const tt = {
  dinhDang: null,   // định dạng đang chọn
  anh: null,        // ảnh gốc
  tenAnh: '',
  tiLePhu: 1,       // tỉ lệ để ảnh vừa phủ kín khung
  zoom: 1,          // 1 = vừa phủ kín
  tamX: 0, tamY: 0, // tâm khung cắt, tính theo pixel ảnh gốc
  doDen: 30,
};
const anhLogo = {}; // ma -> Image

/* ===== Lấy phần tử ===== */
const $ = id => document.getElementById(id);
const khung = $('khung'), manHinh = $('manHinh'), ve = manHinh.getContext('2d');
const thanhZoom = $('thanhZoom'), thanhDen = $('thanhDen');

/* ===== Lưu tạm trong trình duyệt (bọc try vì có máy chặn) ===== */
function docLuu(khoa, macDinh){ try{ const v = localStorage.getItem(khoa); return v === null ? macDinh : JSON.parse(v); }catch(e){ return macDinh; } }
function ghiLuu(khoa, giaTri){ try{ localStorage.setItem(khoa, JSON.stringify(giaTri)); }catch(e){} }

/* ===== Tạo ô chọn định dạng ===== */
function taoOChon(){
  const noi = $('luoiDinhDang');
  DS_DINH_DANG.forEach(dd => {
    const img = new Image(); img.src = dd.phu; anhLogo[dd.ma] = img;
    img.onload = veLai;
    const nut = document.createElement('button');
    nut.type = 'button'; nut.className = 'o-dd'; nut.dataset.ma = dd.ma;
    nut.setAttribute('aria-pressed','false'); nut.title = dd.ten;
    nut.innerHTML = `<img src="${dd.nho}" alt=""><span>${dd.ten}</span>`;
    nut.addEventListener('click', () => chonDinhDang(dd.ma));
    noi.appendChild(nut);
  });
  const daChon = docLuu('thumb_dinhDang', DS_DINH_DANG[0].ma);
  chonDinhDang(DS_DINH_DANG.some(d => d.ma === daChon) ? daChon : DS_DINH_DANG[0].ma);
}
function chonDinhDang(ma){
  tt.dinhDang = DS_DINH_DANG.find(d => d.ma === ma);
  document.querySelectorAll('.o-dd').forEach(n => n.setAttribute('aria-pressed', n.dataset.ma === ma ? 'true' : 'false'));
  ghiLuu('thumb_dinhDang', ma);
  capNhatTenFile(); veLai();
}

/* ===== Mở ảnh ===== */
function moFile(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ baoLoi('File này không phải ảnh. Hãy chọn JPG, PNG hoặc WebP.'); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    tt.anh = img; tt.tenAnh = file.name || 'ảnh dán';
    datLaiKhung();
    khung.classList.remove('trong');
    thanhZoom.disabled = false; $('nutDatLai').disabled = false; $('nutXuat').disabled = false;
    $('thongTinAnh').textContent = `${tt.tenAnh} · gốc ${img.naturalWidth}×${img.naturalHeight}`;
    baoTin('');
  };
  img.onerror = () => { baoLoi('Không đọc được ảnh này (có thể là HEIC). Hãy dùng JPG, PNG hoặc WebP.'); URL.revokeObjectURL(url); };
  img.src = url;
}

/* ===== Tính khung cắt ===== */
function datLaiKhung(){
  const a = tt.anh; if(!a) return;
  tt.tiLePhu = Math.max(RONG / a.naturalWidth, CAO / a.naturalHeight);
  tt.zoom = 1; tt.tamX = a.naturalWidth / 2; tt.tamY = a.naturalHeight / 2;
  capNhatThanhZoom(); veLai();
}
function tiLeHienTai(){ return tt.tiLePhu * tt.zoom; }   // pixel khung / pixel ảnh gốc
function giuTrongAnh(){
  // không cho khung cắt lọt ra ngoài ảnh (ảnh luôn phủ kín)
  const a = tt.anh, s = tiLeHienTai();
  const nuaR = RONG / s / 2, nuaC = CAO / s / 2;
  tt.tamX = Math.min(Math.max(tt.tamX, nuaR), a.naturalWidth - nuaR);
  tt.tamY = Math.min(Math.max(tt.tamY, nuaC), a.naturalHeight - nuaC);
}
function vungCat(){
  const s = tiLeHienTai(), r = RONG / s, c = CAO / s;
  return { x: tt.tamX - r / 2, y: tt.tamY - c / 2, r, c };
}
// phóng to/thu nhỏ quanh một điểm trên khung (px, py theo toạ độ 900x600)
function doiZoom(zoomMoi, px = RONG / 2, py = CAO / 2){
  if(!tt.anh) return;
  zoomMoi = Math.min(Math.max(zoomMoi, 1), ZOOM_TOI_DA);
  const sCu = tiLeHienTai(), v = vungCat();
  const diemX = v.x + px / sCu, diemY = v.y + py / sCu;   // điểm ảnh đang nằm dưới con trỏ
  tt.zoom = zoomMoi;
  const sMoi = tiLeHienTai();
  tt.tamX = diemX - px / sMoi + RONG / sMoi / 2;
  tt.tamY = diemY - py / sMoi + CAO / sMoi / 2;
  giuTrongAnh(); capNhatThanhZoom(); veLai();
}
function capNhatThanhZoom(){
  const pt = Math.round(tt.zoom * 100);
  thanhZoom.value = pt; $('soZoom').textContent = pt + '%';
  // cảnh báo khi ảnh gốc bị phóng quá kích thước thật
  const s = tiLeHienTai();
  $('canhBao').textContent = (tt.anh && s > 1.05) ? `Ảnh gốc nhỏ, đang bị phóng ${Math.round(s * 100)}% — có thể bị mờ` : '';
}

/* ===== Vẽ ===== */
function veLopDen(ctx){
  if(tt.doDen <= 0) return;
  const a = tt.doDen / 100, y0 = CAO * BAT_DAU_LOP_DEN;
  const g = ctx.createLinearGradient(0, y0, 0, CAO);
  for(let i = 0; i <= 10; i++){ const t = i / 10; g.addColorStop(t, `rgba(0,0,0,${(a * Math.pow(t, 1.6)).toFixed(4)})`); }
  ctx.fillStyle = g; ctx.fillRect(0, y0, RONG, CAO - y0);
}
function veLogo(ctx){
  const img = tt.dinhDang && anhLogo[tt.dinhDang.ma];
  if(img && img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, RONG, CAO);
}
// vẽ nhanh cho màn hình xem trước
function veManHinh(){
  ve.clearRect(0, 0, RONG, CAO);
  if(tt.anh){
    const v = vungCat();
    ve.imageSmoothingEnabled = true; ve.imageSmoothingQuality = 'high';
    ve.drawImage(tt.anh, v.x, v.y, v.r, v.c, 0, 0, RONG, CAO);
  }
  veLopDen(ve); veLogo(ve);
}
let choVe = false;
function veLai(){ if(choVe) return; choVe = true; requestAnimationFrame(() => { choVe = false; veManHinh(); }); }

// vẽ chất lượng cao khi xuất: thu nhỏ dần từng nửa để ảnh không bị răng cưa
function veChoXuat(){
  const c = document.createElement('canvas'); c.width = RONG; c.height = CAO;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, RONG, CAO);
  const v = vungCat();
  let nguon = tt.anh, nx = v.x, ny = v.y, nr = v.r, nc = v.c;
  while(nr / 2 >= RONG){
    const tam = document.createElement('canvas');
    tam.width = Math.round(nr / 2); tam.height = Math.round(nc / 2);
    const t = tam.getContext('2d'); t.imageSmoothingEnabled = true; t.imageSmoothingQuality = 'high';
    t.drawImage(nguon, nx, ny, nr, nc, 0, 0, tam.width, tam.height);
    nguon = tam; nx = 0; ny = 0; nr = tam.width; nc = tam.height;
  }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(nguon, nx, ny, nr, nc, 0, 0, RONG, CAO);
  veLopDen(ctx); veLogo(ctx);
  return c;
}

/* ===== Tên file ===== */
function ngayHomNay(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function chuoiNgay(){
  const v = $('oNgay').value || ngayHomNay();
  const [y, m, d] = v.split('-'); return `${d}${m}${y}`;          // dạng 25092026
}
function lamSachTen(s){
  // bỏ dấu, bỏ khoảng trắng, và bỏ chữ "znews" để CMS không đóng logo lần hai
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D')
          .replace(/znews/gi,'').replace(/[^A-Za-z0-9_-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function tenGoc(){ return lamSachTen(`${tt.dinhDang ? tt.dinhDang.ma : 'thumb'}_${chuoiNgay()}`); }
function tenSeLuu(){
  const daXuat = docLuu('thumb_daXuat', {});
  const goc = tenGoc(); const n = daXuat[goc] || 0;
  return n === 0 ? `${goc}.jpg` : `${goc}_${n + 1}.jpg`;
}
function capNhatTenFile(){ $('tenFile').textContent = tenSeLuu(); }

/* ===== Xuất JPG ===== */
function thanhBlob(c, chatLuong){ return new Promise(xong => c.toBlob(xong, 'image/jpeg', chatLuong)); }
async function xuatAnh(){
  if(!tt.anh) return;
  const nut = $('nutXuat'); nut.disabled = true; baoTin('Đang xuất…');
  try{
    const c = veChoXuat();
    let chatLuong = 0.92, blob = await thanhBlob(c, chatLuong);
    while(blob.size > DUNG_LUONG_TOI_DA && chatLuong > 0.5){ chatLuong -= 0.06; blob = await thanhBlob(c, chatLuong); }
    const ten = tenSeLuu();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = ten;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    // ghi nhận đã xuất để lần sau tự thêm _2, _3
    const daXuat = docLuu('thumb_daXuat', {}); const goc = tenGoc();
    daXuat[goc] = (daXuat[goc] || 0) + 1; ghiLuu('thumb_daXuat', daXuat);
    capNhatTenFile();
    baoTin(`Đã tải ${ten} (${Math.round(blob.size / 1024)} KB)`);
  }catch(e){
    baoLoi('Xuất ảnh không được. Thử mở lại tool bằng Chrome.');
  }
  nut.disabled = false;
}

function baoTin(s){ const t = $('thongBao'); t.textContent = s; t.classList.remove('loi'); }
function baoLoi(s){ const t = $('thongBao'); t.textContent = s; t.classList.add('loi'); }

/* ===== Kéo để di chuyển ===== */
let keo = null;
function doiToaDo(e){ const r = manHinh.getBoundingClientRect(); return { x: (e.clientX - r.left) * RONG / r.width, y: (e.clientY - r.top) * CAO / r.height }; }
manHinh.addEventListener('pointerdown', e => {
  if(!tt.anh){ $('oChonFile').click(); return; }
  keo = { ...doiToaDo(e), id: e.pointerId };
  manHinh.setPointerCapture(e.pointerId); khung.classList.add('dang-keo');
});
manHinh.addEventListener('pointermove', e => {
  if(!keo || e.pointerId !== keo.id) return;
  const p = doiToaDo(e), s = tiLeHienTai();
  tt.tamX -= (p.x - keo.x) / s; tt.tamY -= (p.y - keo.y) / s;
  keo.x = p.x; keo.y = p.y; giuTrongAnh(); veLai();
});
function thaTay(e){ if(keo && e.pointerId === keo.id){ keo = null; khung.classList.remove('dang-keo'); } }
manHinh.addEventListener('pointerup', thaTay);
manHinh.addEventListener('pointercancel', thaTay);

/* ===== Cuộn chuột để zoom ===== */
manHinh.addEventListener('wheel', e => {
  if(!tt.anh) return;
  e.preventDefault();
  const p = doiToaDo(e);
  doiZoom(tt.zoom * Math.exp(-e.deltaY * 0.0015), p.x, p.y);
}, { passive: false });

/* ===== Phím tắt khi đang chọn khung ===== */
khung.addEventListener('keydown', e => {
  if(!tt.anh) { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('oChonFile').click(); } return; }
  const buoc = (e.shiftKey ? 50 : 10) / tiLeHienTai();
  const phim = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] }[e.key];
  if(phim){ e.preventDefault(); tt.tamX += phim[0] * buoc; tt.tamY += phim[1] * buoc; giuTrongAnh(); veLai(); }
  else if(e.key === '+' || e.key === '='){ e.preventDefault(); doiZoom(tt.zoom * 1.1); }
  else if(e.key === '-'){ e.preventDefault(); doiZoom(tt.zoom / 1.1); }
});

/* ===== Thả ảnh, dán ảnh, chọn file ===== */
['dragenter','dragover'].forEach(ev => khung.addEventListener(ev, e => { e.preventDefault(); khung.classList.add('tha-vao'); }));
['dragleave','drop'].forEach(ev => khung.addEventListener(ev, e => { e.preventDefault(); khung.classList.remove('tha-vao'); }));
// thả ra ngoài khung cũng nhận, tránh trình duyệt mở ảnh sang tab khác
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if(e.dataTransfer.files[0]) moFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', e => {
  const muc = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if(muc) moFile(muc.getAsFile());
});
$('nutChonAnh').addEventListener('click', () => $('oChonFile').click());
$('oChonFile').addEventListener('change', e => { moFile(e.target.files[0]); e.target.value = ''; });

/* ===== Điều khiển ===== */
thanhZoom.addEventListener('input', () => doiZoom(thanhZoom.value / 100));
thanhDen.addEventListener('input', () => { tt.doDen = +thanhDen.value; $('soDen').textContent = tt.doDen + '%'; ghiLuu('thumb_doDen', tt.doDen); veLai(); });
$('oLuoi').addEventListener('change', e => { $('luoi').classList.toggle('hien', e.target.checked); });
$('nutDatLai').addEventListener('click', datLaiKhung);
$('oNgay').addEventListener('change', capNhatTenFile);
$('nutXuat').addEventListener('click', xuatAnh);

/* ===== Khởi động ===== */
$('oNgay').value = ngayHomNay();
tt.doDen = docLuu('thumb_doDen', 30); thanhDen.value = tt.doDen; $('soDen').textContent = tt.doDen + '%';
taoOChon();
veLai();
</script>
</body>
</html>
